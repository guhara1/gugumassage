  <path d="M110 520 C300 440 480 560 660 480 S980 390 1110 475" fill="none" stroke="#d58972" stroke-width="2" opacity=".26"/>
  <path d="M70 180 C230 90 380 170 520 132 S850 40 1050 150" fill="none" stroke="#e5b94c" stroke-width="1.4" opacity=".12"/>
  <rect x="130" y="110" width="940" height="410" fill="none" stroke="#d58972" opacity=".12"/>
