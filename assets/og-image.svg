      <stop offset="1" stop-color="#080706"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#d58972"/>
      <stop offset="1" stop-color="#e5b94c"/>
    </linearGradient>
    <filter id="blur">
